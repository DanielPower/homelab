services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:14.368.0@sha256:8ec86078b0c461644d896cbe3a9f9bcae7d1ce8dc8d91eeb0b0f1d94c91c072f
    volumes:
      - ./data:/data
    environment:
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_LICENSE_KEY=${FOUNDRY_LICENSE_KEY}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY}
      - FOUNDRY_TELEMETRY=true
      - FOUNDRY_HOSTNAME=rainbowsands.quest
      - FOUNDRY_PROXY_SSL=true
      - FOUNDRY_PROXY_PORT=443
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foundry.rule=Host(`rainbowsands.quest`)"
      - "traefik.http.routers.foundry.entrypoints=websecure"
      - "traefik.http.routers.foundry.tls.certresolver=cloudflare"
    networks:
      - proxy
networks:
  proxy:
    external: true
