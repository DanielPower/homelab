services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    privileged: true
    ports:
      - 8096:8096
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /dev/dri/renderD128:/dev/dri/renderD128
      - type: bind
        source: /nas/main/media/movies
        target: /data/movies
        read_only: true
      - type: bind
        source: /nas/main/media/shows
        target: /data/shows
        read_only: true
      - type: bind
        source: /nas/main/media/music
        target: /data/music
        read_only: true
      - type: bind
        source: /nas/main/media/youtube
        target: /data/youtube
        read_only: true
      - type: bind
        source: /nas/main/media/books
        target: /data/books
        read_only: true
      - type: bind
        source: /nas/main/media/music_videos
        target: /data/music_videos
        read_only: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.crispy.coffee`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=tls"
    networks:
      - proxy
    restart: always

networks:
  proxy:
    external: true
