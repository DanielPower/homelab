services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    privileged: true
    ports:
      - 8096:8096
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /dev/dri/renderD128:/dev/dri/renderD128
      - type: volume
        source: movies
        target: /data/movies
        read_only: true
      - type: volume
        source: shows
        target: /data/shows
        read_only: true
      - type: volume
        source: music
        target: /data/music
        read_only: true
      - type: volume
        source: youtube
        target: /data/youtube
        read_only: true
      - type: volume
        source: books
        target: /data/books
        read_only: true
      - type: volume
        source: music_videos
        target: /data/music_videos
        read_only: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.crispy.coffee`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=tls"
    networks:
      - proxy
    restart: always

volumes:
  movies:
    driver_opts:
      type: "nfs"
      device: ":/main/media/movies"
      o: "addr=192.168.0.60,vers=4,ro"
  shows:
    driver_opts:
      type: "nfs"
      device: ":/main/media/shows"
      o: "addr=192.168.0.60,vers=4,ro"
  music:
    driver_opts:
      type: "nfs"
      device: ":/main/media/music"
      o: "addr=192.168.0.60,vers=4,ro"
  youtube:
    driver_opts:
      type: "nfs"
      device: ":/main/media/youtube"
      o: "addr=192.168.0.60,vers=4,ro"
  books:
    driver_opts:
      type: "nfs"
      device: ":/main/media/books"
      o: "addr=192.168.0.60,vers=4,ro"
  music_videos:
    driver_opts:
      type: "nfs"
      device: ":/main/media/music_videos"
      o: "addr=192.168.0.60,vers=4,ro"
networks:
  proxy:
    external: true
