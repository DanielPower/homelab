services:
    vpn:
        image: docker.io/qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        container_name: vpn
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./gluetun:/gluetun
        environment:
            - VPN_SERVICE_PROVIDER=private internet access
            - OPENVPN_USER=${OPENVPN_USER}
            - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
            - PORT_FORWARD_ONLY=true
            - SERVER_REGIONS=CA Toronto
            - VPN_PORT_FORWARDING=on
            - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
            - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /gluetun/update-qbittorrent-port.sh {{PORTS}}
            - FIREWALL_INPUT_PORTS=8085
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.bit.vet`)"
            - "traefik.http.routers.qbittorrent.entrypoints=websecure"
            - "traefik.http.routers.qbittorrent.tls.certresolver=porkbun"
            - "traefik.http.routers.qbittorrent.middlewares=private-only@file"
            - "traefik.http.services.qbittorrent.loadbalancer.server.port=8085"
        networks:
            - proxy
        restart: unless-stopped

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        container_name: qbittorrent
        network_mode: "service:vpn"
        depends_on:
            - vpn
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            - WEBUI_PORT=8085
        volumes:
            - ./qbittorrent/config:/config
            - downloads:/downloads
        restart: unless-stopped

volumes:
    downloads:
        driver_opts:
            type: "nfs"
            device: ":/main/media/downloads/qbittorrent"
            o: "addr=192.168.0.60,vers=4,rw"

networks:
    proxy:
        external: true
