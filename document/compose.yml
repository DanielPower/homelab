services:
  document:
    image: ghcr.io/danielpower/document:latest@sha256:7c8488f3efd7ea48f3d85117227eb42d498fbb0d063f3cc4c1d1392f0271480e
    container_name: document
    restart: unless-stopped
    environment:
      # Role and database come from postgres/apps/docket.sql.
      DATABASE_URL: postgresql://docket:${DOCKET_DB_PASSWORD}@postgres:5432/docket
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: claude-haiku-5-5
      # Qwen3-Embedding-4B in llama-swap (always-on group), over the proxy network.
      EMBEDDING_URL: http://llama-swap:8080/v1
      EMBEDDING_MODEL: qwen3-embedding-4b
      # Scan to FTP: the scanner's FTP profile points at this host, port 21,
      # passive mode, user "scanner". Set both values in document/.env.
      FTP_USER: scanner
      FTP_PASSWORD: ${DOCKET_FTP_PASSWORD}
      # This host's LAN IP, given to the scanner for passive transfers.
      FTP_PASV_ADDRESS: ${DOCKET_FTP_PASV_ADDRESS}
      FTP_PASV_PORTS: 30000-30009
    ports:
      # LAN only: Docket's FTP has no TLS. Don't forward these on the router.
      - "21:2121"
      - "30000-30009:30000-30009"
    volumes:
      - data:/data
      - consume:/consume
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.document.rule=Host(`docs.bit.vet`)"
      - "traefik.http.routers.document.entrypoints=websecure"
      - "traefik.http.routers.document.tls.certresolver=porkbun"
      # The container also listens for FTP (2121, 30000-30009); pin Traefik to
      # the web port so it never picks one of those.
      - "traefik.http.services.document.loadbalancer.server.port=8080"
      # Docket has no login of its own. Traefik routes by Host header, so this
      # also refuses requests that reach the public IP with Host: docs.bit.vet.
      - "traefik.http.routers.document.middlewares=private-only@file,compression@file"
    networks:
      - proxy
      - db

volumes:
  # Originals, searchable PDFs and thumbnails.
  data:
    driver_opts:
      type: "nfs"
      device: ":/main/lab/document/data"
      o: "addr=192.168.0.60,vers=4,rw"
  # Drop folder: files here are ingested, then deleted.
  consume:
    driver_opts:
      type: "nfs"
      device: ":/main/lab/document/consume"
      o: "addr=192.168.0.60,vers=4,rw"

networks:
  proxy:
    external: true
  db:
    external: true
