services:
    broker:
      image: docker.io/valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
      restart: unless-stopped
      volumes:
        - redisdata:/data
    webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
        restart: unless-stopped
        depends_on:
            - broker
            - gotenberg
            - tika
        ports:
            - "8000:8000"
        volumes:
            - data:/usr/src/paperless/data
            - media:/usr/src/paperless/media
            - export:/usr/src/paperless/export
            - consume:/usr/src/paperless/consume
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.paperless.rule=Host(`paperless.bit.vet`)"
            - "traefik.http.routers.paperless.entrypoints=websecure"
            - "traefik.http.routers.paperless.tls.certresolver=porkbun"
            - "traefik.http.routers.paperless.middlewares=private-only@file"
        networks:
            - proxy
            - default
            - db
        environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBHOST: postgres
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER: paperless
            PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_URL: https://paperless.bit.vet
            PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
            PAPERLESS_TIME_ZONE: "America/St_Johns"
    gotenberg:
        image: docker.io/gotenberg/gotenberg:9.0.0@sha256:01144a5c897a21b966f1abb9836d2f3bac1e3c8196087bab73f697878345638a
        restart: unless-stopped
        # The gotenberg chromium route is used to convert .eml files. We do not
        # want to allow external content like tracking pixels or even javascript.
        command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
    tika:
        image: docker.io/apache/tika:3.4.0.0@sha256:9f3e5bb9da4229a971a4839416b3204499f20668ee834fa741a6a7504bbea7bf
        restart: unless-stopped
volumes:
    redisdata:
    data:
        driver_opts:
            type: "nfs"
            device: ":/fast/lab/paperless/data"
            o: "addr=192.168.0.60,vers=4,rw"
    media:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/media"
            o: "addr=192.168.0.60,vers=4,rw"
    export:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/export"
            o: "addr=192.168.0.60,vers=4,rw"
    consume:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/consume"
            o: "addr=192.168.0.60,vers=4,rw"
networks:
    proxy:
        external: true
    db:
        external: true
