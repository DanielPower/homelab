services:
    broker:
      image: docker.io/valkey/valkey:9-alpine
      restart: unless-stopped
      volumes:
        - /nas/fast/lab/paperless/redisdata:/data
    db:
      image: docker.io/library/postgres:18
      restart: unless-stopped
      volumes:
        - /nas/fast/lab/paperless/pgdata:/var/lib/postgresql
      environment:
        PGDATA: /var/lib/postgresql/data
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:latest
        restart: unless-stopped
        depends_on:
            - db
            - broker
            - gotenberg
            - tika
        ports:
            - "8000:8000"
        volumes:
            - /nas/fast/lab/paperless/data:/usr/src/paperless/data
            - /nas/main/lab/paperless/media:/usr/src/paperless/media
            - /nas/main/lab/paperless/export:/usr/src/paperless/export
            - /nas/main/lab/paperless/consume:/usr/src/paperless/consume
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.paperless.rule=Host(`paperless.bit.vet`)"
            - "traefik.http.routers.paperless.entrypoints=websecure"
            - "traefik.http.routers.paperless.tls.certresolver=porkbun"
        networks:
            - proxy
            - default
        environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBHOST: db
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_URL: https://paperless.bit.vet
            PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
            PAPERLESS_TIME_ZONE: "America/St_Johns"
    gotenberg:
        image: docker.io/gotenberg/gotenberg:8.20
        restart: unless-stopped
        # The gotenberg chromium route is used to convert .eml files. We do not
        # want to allow external content like tracking pixels or even javascript.
        command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
    tika:
        image: docker.io/apache/tika:latest
        restart: unless-stopped
networks:
    proxy:
        external: true
