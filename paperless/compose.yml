services:
    broker:
      image: docker.io/valkey/valkey:9.1.1-alpine@sha256:15568b9cb7eb67f4aed4de018c23f13d344e0e6437b31fe8fb8823dc81ebb3a9
      restart: unless-stopped
      volumes:
        - redisdata:/data
    webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5@sha256:65a4cabf0169ea7fbd90ab7bb28ba3f8b5909613635acda1a03ad606f34b456b
        restart: unless-stopped
        depends_on:
            - broker
            - gotenberg
            - tika
        ports:
            - "8000:8000"
        volumes:
            - data:/usr/src/paperless/data
            - media:/usr/src/paperless/media
            - export:/usr/src/paperless/export
            - consume:/usr/src/paperless/consume
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.paperless.rule=Host(`paperless.bit.vet`)"
            - "traefik.http.routers.paperless.entrypoints=websecure"
            - "traefik.http.routers.paperless.tls.certresolver=porkbun"
        networks:
            - proxy
            - default
            - db
        environment:
            PAPERLESS_REDIS: redis://broker:6379
            PAPERLESS_DBHOST: postgres
            PAPERLESS_DBNAME: paperless
            PAPERLESS_DBUSER: paperless
            PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://tika:9998
            PAPERLESS_URL: https://paperless.bit.vet
            PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
            PAPERLESS_TIME_ZONE: "America/St_Johns"
    gotenberg:
        image: docker.io/gotenberg/gotenberg:8.20.1@sha256:cda4386c7ed38f18bc6897828be01ba7361c99929a5c84ec5e293d7916e29bac
        restart: unless-stopped
        # The gotenberg chromium route is used to convert .eml files. We do not
        # want to allow external content like tracking pixels or even javascript.
        command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
    tika:
        image: docker.io/apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
        restart: unless-stopped
volumes:
    redisdata:
    data:
        driver_opts:
            type: "nfs"
            device: ":/fast/lab/paperless/data"
            o: "addr=192.168.0.60,vers=4,rw"
    media:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/media"
            o: "addr=192.168.0.60,vers=4,rw"
    export:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/export"
            o: "addr=192.168.0.60,vers=4,rw"
    consume:
        driver_opts:
            type: "nfs"
            device: ":/main/lab/paperless/consume"
            o: "addr=192.168.0.60,vers=4,rw"
networks:
    proxy:
        external: true
    db:
        external: true
