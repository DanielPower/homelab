services:
  thumbor:
    image: ghcr.io/minimalcompact/thumbor
    container_name: thumbor
    environment:
      THUMBOR_PORT: "80"
      LOADER: "thumbor.loaders.file_loader"
      FILE_LOADER_ROOT_PATH: "/data/media"
    volumes:
      - /nas/main/lab/thumbor:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.thumbor.rule=Host(`thumbor.danielpower.ca`)"
      - "traefik.http.routers.thubmor.entrypoints=websecure"
      - "traefik.http.routers.thumbor.tls.certresolver=danielpowerca"
      - "traefik.http.routers.thumbor.middlewares=compression@file"
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
