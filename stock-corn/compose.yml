services:
  stock-corn:
    image: ghcr.io/danielpower/stock-corn:master
    environment:
      DATABASE_PATH: /data/db.sqlite
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      CORN_CZAR_ID: ${CORN_CZAR_ID}
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-corn.rule=Host(`corn.crispy.coffee`)"
      - "traefik.http.routers.stock-corn.entrypoints=websecure"
      - "traefik.http.routers.stock-corn.tls.certresolver=tls"
    volumes:
      - data:/data
    networks:
      - proxy
    restart: unless-stopped
networks:
  proxy:
    external: true
volumes:
  data:
    driver_opts:
      type: "nfs"
      device: ":/fast/lab/stock-corn"
      o: "addr=192.168.0.60,vers=4,rw"
