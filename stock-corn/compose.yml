services:
  stock-corn:
    image: ghcr.io/danielpower/stock-corn:master@sha256:cb8bd62cf81249e1d4d0ce71bc6c578c96e3b2f861ed2002dd0b5252457d9be9
    environment:
      DATABASE_PATH: /data/db.sqlite
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      CORN_CZAR_ID: ${CORN_CZAR_ID}
      # Market news articles, written by llama-swap over the proxy network.
      NEWS_LLM_URL: http://llama-swap:8080/v1
      NEWS_LLM_MODEL: qwen3.6-35b-a3b
      MARKET_NEWS_CHANNEL_ID: ${MARKET_NEWS_CHANNEL_ID}
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-corn.rule=Host(`corn.crispy.coffee`)"
      - "traefik.http.routers.stock-corn.entrypoints=websecure"
      - "traefik.http.routers.stock-corn.tls.certresolver=tls"
    volumes:
      - data:/data
    networks:
      - proxy
    restart: unless-stopped
networks:
  proxy:
    external: true
volumes:
  data:
    driver_opts:
      type: "nfs"
      device: ":/fast/lab/stock-corn"
      o: "addr=192.168.0.60,vers=4,rw"
