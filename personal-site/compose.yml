services:
  personal-site:
    image: ghcr.io/danielpower/personal-site:main@sha256:926baf46b3ee2aa4d102d1ed2c8c18d217e9db64d13b5bdd3875a864021b9ba2
    container_name: personal-site
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personal-site.rule=Host(`danielpower.ca`)"
      - "traefik.http.routers.personal-site.entrypoints=websecure"
      - "traefik.http.routers.personal-site.tls.certresolver=cloudflare"
      - "traefik.http.routers.personal-site.middlewares=compression@file"
      - "traefik.http.routers.personal-site-www.rule=Host(`www.danielpower.ca`)"
      - "traefik.http.routers.personal-site-www.entrypoints=websecure"
      - "traefik.http.routers.personal-site-www.tls.certresolver=cloudflare"
      - "traefik.http.routers.personal-site-www.middlewares=compression@file"
    restart: unless-stopped
    networks:
      - proxy
networks:
  proxy:
    external: true
