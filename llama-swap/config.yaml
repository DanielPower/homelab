healthCheckTimeout: 300

# Speed notes (Strix Halo, Vulkan): decode is memory-bandwidth bound, so the
# Qwen models use MTP speculative decoding via the draft head built into the
# GGUF (blk.*.nextn.* tensors). If a quant lacks those tensors, draft-mtp
# silently does nothing; check with: strings -n 8 model.gguf | grep -m1 nextn
# MTP lowers total throughput with 3+ concurrent requests, hence --parallel 1.
# Keep --spec-draft-n-max at 2-3; 4 is slower on Vulkan (llama.cpp #30568).
# KV cache stays f16: quantized KV was reported to break tool calling.

models:
  qwen3.8-27b:
    cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --model /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --ctx-size 131072
      --n-gpu-layers 999
      --flash-attn on
      --no-mmap
      --spec-type draft-mtp,ngram-mod
      --spec-draft-n-max 2
      --cache-ram 8192
      --ctx-checkpoints 8
      --parallel 1
      --jinja
    ttl: 600
  qwen3.6-35b-a3b:
    cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --ctx-size 131072
      --n-gpu-layers 999
      --flash-attn on
      --no-mmap
      --spec-type draft-mtp,ngram-mod
      --spec-draft-n-max 2
      --cache-ram 8192
      --ctx-checkpoints 32
      --parallel 1
      --jinja
    ttl: 600
  qwen3.8-125b-a6b:
    cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --model /models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      --ctx-size 131072
      --n-gpu-layers 999
      --flash-attn on
      --no-mmap
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --spec-draft-p-min 0.0
      --batch-size 2048
      --ubatch-size 2048
      --jinja
    ttl: 600
  whisper-v3-large:
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/audio/transcriptions/
    cmd: |
      whisper-server
      --port ${PORT}
      --host 0.0.0.0
      --model /models/ggml-large-v3.bin
      --request-path /v1/audio/transcriptions
      --inference-path ""
      --convert
      --vad
      --vad-model /models/ggml-silero-v6.2.0.bin
      --vad-threshold 0.60
      --vad-min-speech-duration-ms 250
      --vad-min-silence-duration-ms 300
      --vad-max-speech-duration-s 20
      --vad-samples-overlap 0.10
      --suppress-nst
      --no-language-probabilities
    ttl: 600
  # Embeddings for Docket's semantic search (OpenAI-compatible /v1/embeddings).
  # Kept loaded next to everything else; see the always-on group.
  qwen3-embedding-4b:
    cmd: |
      llama-server
      --port ${PORT}
      --host 0.0.0.0
      --model /models/Qwen3-Embedding-4B-Q8_0.gguf
      --embedding
      --pooling last
      --ctx-size 8192
      --batch-size 2048
      --ubatch-size 2048
      --n-gpu-layers 999
    ttl: 0
groups:
  "always-on":
    persistent: true
    swap: false
    exclusive: false
    members:
      # - "qwen3.8-27b"
      # - "qwen3.6-35b-a3b"
      - "qwen3.8-125b-a6b"
      - "whisper-v3-large"
      - "qwen3-embedding-4b"
