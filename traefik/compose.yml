services:
    traefik:
        image: docker.io/library/traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
        container_name: traefik
        restart: unless-stopped
        environment:
            PORKBUN_SECRET_API_KEY: ${PORKBUN_SECRET_API_KEY}
            PORKBUN_API_KEY: ${PORKBUN_API_KEY}
            CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.traefik.rule=Host(`traefik.bit.vet`)"
            - "traefik.http.routers.traefik.entrypoints=websecure"
            - "traefik.http.routers.traefik.tls.certresolver=porkbun"
            - "traefik.http.routers.traefik.service=api@internal"
            - "traefik.http.routers.traefik.middlewares=private-only@file"
        ports:
            - "80:80"
            - "443:443"
            - "8080:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /lab/letsencrypt:/letsencrypt
            - ./traefik.yml:/etc/traefik/traefik.yml
            - ./dynamic:/dynamic
        networks:
            - proxy
networks:
    proxy:
        external: true
