api:
  dashboard: true
  insecure: true
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "0s"
providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /dynamic
    watch: true
certificatesResolvers:
  tls:
    acme:
      email: me@danielpower.ca
      storage: /letsencrypt/acme.json
      tlsChallenge: true
  porkbun:
    acme:
      email: me@danielpower.ca
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: porkbun
  cloudflare:
    acme:
      email: me@danielpower.ca
      storage: /letsencrypt/acme.json
      dnschallenge:
        provider: cloudflare
