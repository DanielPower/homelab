services:
  cloudflare-ddns:
    image: docker.io/favonia/cloudflare-ddns:1.18.0@sha256:345b41895a8846d74c62d30bd27e61101a754f8ab8da10c68115823883803afb
    network_mode: host
    restart: always
    read_only: true
    cap_drop: [all]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=crispy.coffee,*.crispy.coffee,danielpower.ca,*.danielpower.ca,osu.observer,*.osu.observer,libby.bot,*.libby.bot,rainbowsands.quest,*.rainbowsands.quest,jiwajiwa.app,*.jiwajiwa.app
