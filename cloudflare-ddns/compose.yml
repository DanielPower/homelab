services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    network_mode: host
    restart: always
    read_only: true
    cap_drop: [all]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=crispy.coffee,*.crispy.coffee,danielpower.ca,*.danielpower.ca,osu.observer,*.osu.observer,libby.bot,*.libby.bot,rainbowsands.quest,*.rainbowsands.quest,jiwajiwa.app,*.jiwajiwa.app
