services:
    sonarr:
        image: linuxserver/sonarr
        container_name: sonarr
        restart: unless-stopped
        volumes:
            - ./sonarr/config:/config
            - shows:/data/shows
            - downloads:/downloads
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.sonarr.rule=Host(`sonarr.bit.vet`)"
            - "traefik.http.routers.sonarr.entrypoints=websecure"
            - "traefik.http.routers.sonarr.tls.certresolver=porkbun"
    radarr:
        image: linuxserver/radarr
        container_name: radarr
        restart: unless-stopped
        volumes:
            - ./radarr/config:/config
            - movies:/data/movies
            - downloads:/downloads
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.radarr.rule=Host(`radarr.bit.vet`)"
            - "traefik.http.routers.radarr.entrypoints=websecure"
            - "traefik.http.routers.radarr.tls.certresolver=porkbun"
    prowlarr:
        image: linuxserver/prowlarr
        container_name: prowlarr
        restart: unless-stopped
        volumes:
            - ./prowlarr/config:/config
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.bit.vet`)"
            - "traefik.http.routers.prowlarr.entrypoints=websecure"
            - "traefik.http.routers.prowlarr.tls.certresolver=porkbun"
    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        environment:
            - LOG_LEVEL=info
            - LOG_HTML=false
            - CAPTCHA_SOLVER=none
            - TZ=Europe/London
        networks:
            - proxy
        ports:
            - "8191:8191"
        restart: unless-stopped
volumes:
    shows:
        driver_opts:
            type: "nfs"
            device: ":/main/media/shows"
            o: "addr=192.168.0.60,vers=4,rw"
    movies:
        driver_opts:
            type: "nfs"
            device: ":/main/media/movies"
            o: "addr=192.168.0.60,vers=4,rw"
    downloads:
        driver_opts:
            type: "nfs"
            device: ":/main/media/downloads/qbittorrent"
            o: "addr=192.168.0.60,vers=4,rw"
networks:
    proxy:
        external: true
