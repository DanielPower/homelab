services:
    sonarr:
        image: docker.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
        container_name: sonarr
        restart: unless-stopped
        volumes:
            - ./sonarr/config:/config
            - shows:/data/shows
            - downloads:/downloads
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.sonarr.rule=Host(`sonarr.bit.vet`)"
            - "traefik.http.routers.sonarr.entrypoints=websecure"
            - "traefik.http.routers.sonarr.tls.certresolver=porkbun"
    radarr:
        image: docker.io/linuxserver/radarr:6.3.0.10514-ls313@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
        container_name: radarr
        restart: unless-stopped
        volumes:
            - ./radarr/config:/config
            - movies:/data/movies
            - downloads:/downloads
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.radarr.rule=Host(`radarr.bit.vet`)"
            - "traefik.http.routers.radarr.entrypoints=websecure"
            - "traefik.http.routers.radarr.tls.certresolver=porkbun"
    prowlarr:
        image: docker.io/linuxserver/prowlarr:2.5.2.5491-ls156@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
        container_name: prowlarr
        restart: unless-stopped
        volumes:
            - ./prowlarr/config:/config
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.bit.vet`)"
            - "traefik.http.routers.prowlarr.entrypoints=websecure"
            - "traefik.http.routers.prowlarr.tls.certresolver=porkbun"
    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
        container_name: flaresolverr
        environment:
            - LOG_LEVEL=info
            - LOG_HTML=false
            - CAPTCHA_SOLVER=none
            - TZ=Europe/London
        networks:
            - proxy
        ports:
            - "8191:8191"
        restart: unless-stopped
volumes:
    shows:
        driver_opts:
            type: "nfs"
            device: ":/main/media/shows"
            o: "addr=192.168.0.60,vers=4,rw"
    movies:
        driver_opts:
            type: "nfs"
            device: ":/main/media/movies"
            o: "addr=192.168.0.60,vers=4,rw"
    downloads:
        driver_opts:
            type: "nfs"
            device: ":/main/media/downloads/qbittorrent"
            o: "addr=192.168.0.60,vers=4,rw"
networks:
    proxy:
        external: true
