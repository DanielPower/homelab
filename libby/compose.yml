name: libby
services:
  db-migrate:
    image: ghcr.io/rainbow-sands/libby/db:main@sha256:67cbc6f1a167c7f9c3ccef4ec92100340e3afdaead6f1c401293687837fd9f6d
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - default
      - db
    restart: "no"
  discord:
    image: ghcr.io/rainbow-sands/libby/discord:main@sha256:a9d4fbb6d89d5419c192dd462a7ea47b3605e002c3285919f6716cdd265a583e
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_ARTIFACT: ${S3_BUCKET_ARTIFACT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      WEB_URL: ${ORIGIN}
    networks:
      - default
      - db
    restart: unless-stopped
  worker:
    image: ghcr.io/rainbow-sands/libby/worker:main@sha256:23078bf1c3dd3a5f925fc567b9661a3e290df9314f018d8bba90659a0ee49d3d
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      WEB_URL: ${ORIGIN}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL}
      SUMMARIZATION_PROVIDER: ${SUMMARIZATION_PROVIDER}
      SUMMARIZATION_API_KEY: ${SUMMARIZATION_API_KEY}
      SUMMARIZATION_BASE_URL: ${SUMMARIZATION_BASE_URL}
      SUMMARIZATION_MODEL: ${SUMMARIZATION_MODEL}
      SUMMARIZATION_REASONING_EFFORT: ${SUMMARIZATION_REASONING_EFFORT}
      SUMMARIZATION_THINKING_BUDGET: ${SUMMARIZATION_THINKING_BUDGET}
      TRANSCRIPTION_CONCURRENCY: ${TRANSCRIPTION_CONCURRENCY}
      PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_ARTIFACT: ${S3_BUCKET_ARTIFACT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    networks:
      - default
      - db
    restart: unless-stopped
  web:
    image: ghcr.io/rainbow-sands/libby/web:main@sha256:f288576f97dddc4868e4583ca0e083adc333ce78816c4b41cb87e137064550e7
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ORIGIN: ${ORIGIN}
      CHAT_PROVIDER: ${CHAT_PROVIDER}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT}
      CHAT_THINKING_BUDGET: ${CHAT_THINKING_BUDGET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_ARTIFACT: ${S3_BUCKET_ARTIFACT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-10G}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.libby-web.rule=Host(`libby.bot`)"
      - "traefik.http.routers.libby-web.entrypoints=websecure"
      - "traefik.http.routers.libby-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.libby-web.middlewares=compression@file"
    networks:
      - default
      - proxy
      - db
    restart: unless-stopped
  pg-boss-dashboard:
    image: docker.io/library/node:26.12.0@sha256:45a2bf9d9300e9cf47ecb375e38447c140c45ef5fbae869c430475b05b98d86e
    ports:
      - 3000
    working_dir: /app
    command: sh -c "npm install -g @pg-boss/dashboard@1.10.0 && pg-boss-dashboard"
    environment:
      DATABASE_URL: ${DATABASE_URL}&uselibpqcompat=true
      PGBOSS_SCHEMA: pgboss
    networks:
      - default
      - proxy
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.libby-pgboss.rule=Host(`libby-pgboss.bit.vet`)"
      - "traefik.http.routers.libby-pgboss.entrypoints=websecure"
      - "traefik.http.routers.libby-pgboss.tls.certresolver=porkbun"
      - "traefik.http.routers.libby-pgboss.middlewares=compression@file"
networks:
  proxy:
    external: true
  db:
    external: true
