# The cipher pass comes from PGBACKREST_REPO1_CIPHER_PASS (see .env).
[global]
# NFS volume from the QNAP: main/lab/postgres-backup
repo1-type=posix
repo1-path=/backups
repo1-retention-full=4
repo1-cipher-type=aes-256-cbc

compress-type=zst
process-max=2
start-fast=y

archive-async=y
spool-path=/var/lib/postgresql/spool
# If the NAS is unreachable long enough to queue this much WAL, drop it rather
# than fill the disk. The PITR chain breaks until the next full backup.
archive-push-queue-max=4GiB

log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
